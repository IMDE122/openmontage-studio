version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    environment:
      - FAL_KEY=${FAL_KEY}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEBUG=true
    volumes:
      - ./backend.py:/app/backend.py:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Frontend Development Server (Vite)
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-builder
    ports:
      - "3000:3000"
    volumes:
      - ./:/app:cached
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

  # Production Frontend (Nginx)
  frontend-prod:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    profiles:
      - production

  # OpenMontage Python Environment (for full pipeline support)
  openmontage:
    build:
      context: ../OpenMontage
      dockerfile: Dockerfile
    volumes:
      - ../OpenMontage:/workspace/OpenMontage:cached
      - ./projects:/workspace/OpenMontage/projects:cached
    environment:
      - FAL_KEY=${FAL_KEY}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    working_dir: /workspace/OpenMontage
    command: sleep infinity
    profiles:
      - full

volumes:
  openmontage-projects:

networks:
  default:
    name: openmontage-network