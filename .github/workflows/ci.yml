name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Python syntax check
        run: python -m py_compile backend.py

      - name: Run backend tests
        run: |
          python -c "
import asyncio
import sys
sys.path.insert(0, '.')
from backend import app, MockProvider, VideoGenerationRequest, ImageGenerationRequest
print('Backend imports OK')

# Test mock providers
async def test():
    video_result = await MockProvider.generate_video(VideoGenerationRequest(
        prompt='test', model='test', aspect_ratio='16:9', duration=5
    ))
    print(f'Video result: {video_result.primary_url}')

    image_result = await MockProvider.generate_image(ImageGenerationRequest(
        prompt='test', model='test', aspect_ratio='1:1', count=1
    ))
    print(f'Image result: {image_result.primary_url}')

    print('Mock providers OK')

asyncio.run(test())
"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Validate HTML
        run: |
          python3 -c "
import html
with open('index.html', 'r') as f:
    content = f.read()
assert '<!DOCTYPE html>' in content
assert '<html' in content
assert '<head>' in content
assert '<body' in content
assert '<script' in content
assert '<style>' in content
print('HTML structure valid')
print(f'Size: {len(content)} chars')
"

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: openmontage-studio:latest
          load: true

      - name: Test Docker image
        run: |
          docker run --rm -d -p 8000:8000 --name test-container openmontage-studio:latest
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop test-container

  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4